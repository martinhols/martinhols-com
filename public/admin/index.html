<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | MartinHols.com</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@300;400;500&family=Ubuntu:wght@300;400;500&display=swap">
<style>
:root{--bg:#051E31;--card:#0B2A42;--line:#ffffff26;--ink:#F4EFE6;--mut:#a9b8c4;--acc:#FF8A1F;--on:#051E31;--cream:#F4EFE6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 Rokkitt,serif}
h1,h2,h3,label,button,.tab,.badge{font-family:Ubuntu,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 96px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
header.top h1{font:500 22px/1 Ubuntu,sans-serif;margin:0}
.btn{font:500 15px/1 Ubuntu,sans-serif;border:0;border-radius:10px;padding:14px 18px;cursor:pointer;background:var(--acc);color:var(--on)}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}.btn.d{background:#b42318;color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-size:15px}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}.row b{font:500 17px Ubuntu,sans-serif}.row small{color:var(--mut);display:block}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.badge.on{background:#1b7a3d;color:#fff;border-color:#1b7a3d}
label{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;background:#041726;border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--ink);font:400 18px Rokkitt,serif}
textarea{min-height:120px;resize:vertical}textarea.big{min-height:360px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.th{position:relative;width:110px;height:84px;border-radius:10px;overflow:hidden;background:#000}
.th img{width:100%;height:100%;object-fit:cover}.th button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:#000b;color:#fff;cursor:pointer}
.faq{display:grid;gap:8px;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:10px}
.msg{margin:14px 0;padding:12px 14px;border-radius:10px;background:#0f3a59;font:400 15px Ubuntu,sans-serif}.msg.err{background:#5b1a14}
.bar{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;padding:14px 0;background:linear-gradient(transparent,var(--bg) 30%);margin-top:20px}
.hint{color:var(--mut);font:400 14px Ubuntu,sans-serif;margin-top:6px}
.chk{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink)}
.chk input{width:22px;height:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://rpspddxsnedszscudfke.supabase.co',SB_KEY='sb_publishable__p3yyQ_mtRIaa-MDEWG_CQ_vn0cEPVB';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=(s,r=document)=>r.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slugify=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const CATS=[['festivals','Festivals'],['corporate','Corporate'],['sport','Sport'],['shows-music','Shows / Music']];
let tab='projects',cur=null,msg='',err=false;
const hook=()=>{try{return localStorage.getItem('deployHook')||''}catch(e){return''}};

async function init(){const{data}=await sb.auth.getSession();data.session?list():login()}
function login(m=''){app.innerHTML=`<div class="card" style="max-width:420px;margin:12vh auto 0"><h1 style="font:500 24px Ubuntu">Admin</h1>
<form id="f"><label>E-mail</label><input type="email" id="e" autocomplete="username" required><label>Wachtwoord</label><input type="password" id="p" autocomplete="current-password" required>
${m?`<div class="msg err">${esc(m)}</div>`:''}<div style="margin-top:20px"><button class="btn" style="width:100%">Inloggen</button></div></form></div>`;
$('#f').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});error?login('Inloggen mislukt: '+error.message):list()}}

async function list(){cur=null;
const{data,error}=await sb.from(tab).select('*').order('created_at',{ascending:false});
app.innerHTML=`<header class="top"><h1>MartinHols.com admin</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn o" id="pub">Site publiceren</button><button class="btn o" id="out">Uitloggen</button></div></header>
<div class="tabs"><button class="tab ${tab==='projects'?'on':''}" data-t="projects">Projecten</button><button class="tab ${tab==='posts'?'on':''}" data-t="posts">Blog</button></div>
${msg?`<div class="msg ${err?'err':''}">${esc(msg)}</div>`:''}
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="margin:0;font:500 20px Ubuntu">${tab==='projects'?'Projecten':'Blogartikelen'}</h2><button class="btn" id="new">+ Nieuw</button></div>
${error?`<div class="msg err">${esc(error.message)}</div>`:''}
${(data||[]).map(r=>`<div class="row" data-id="${r.id}"><div><b>${esc(r.title)}</b><small>/${tab==='projects'?'projects':'blog'}/${esc(r.slug)}</small></div><span class="badge ${r.published?'on':''}">${r.published?'Online':'Concept'}</span></div>`).join('')||'<p style="color:var(--mut)">Nog niets. Klik op “Nieuw”.</p>'}</div>`;
msg='';err=false;window._rows=data||[];
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;list()});
$('#new').onclick=()=>edit({});document.querySelectorAll('.row').forEach(r=>r.onclick=()=>edit(window._rows.find(x=>x.id===r.dataset.id)));
$('#out').onclick=async()=>{await sb.auth.signOut();login()};$('#pub').onclick=publish}

async function publish(){let h=hook();
if(!h){h=prompt('Plak de Vercel Deploy Hook URL (eenmalig). Zie de uitleg in de chat.');if(!h)return;try{localStorage.setItem('deployHook',h.trim())}catch(e){}}
try{const r=await fetch(h.trim(),{method:'POST'});msg=r.ok?'Site wordt opnieuw gebouwd. Binnen ±1 minuut staat je wijziging live.':'Publiceren mislukt ('+r.status+').';err=!r.ok}catch(e){msg='Publiceren mislukt: '+e.message;err=true}list()}

function resize(file,max=2400){return new Promise((res,rej)=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('resize')),'image/jpeg',.86);URL.revokeObjectURL(u)};i.onerror=()=>rej(new Error('Geen geldige afbeelding'));i.src=u})}
async function upload(file,slug){const b=await resize(file),name=`${slug||'misc'}/${Date.now()}-${slugify(file.name.replace(/\.[^.]+$/,''))}.jpg`;
const{error}=await sb.storage.from('photos').upload(name,b,{contentType:'image/jpeg',upsert:false});if(error)throw error;return sb.storage.from('photos').getPublicUrl(name).data.publicUrl}

function edit(r){cur={...r};const isP=tab==='projects';cur.gallery=cur.gallery||[];cur.faq=cur.faq||[];
app.innerHTML=`<header class="top"><h1>${r.id?'Bewerken':'Nieuw'} · ${isP?'project':'artikel'}</h1><button class="btn o" id="back">← Terug</button></header>
<div class="card"><div id="m"></div>
<label>Titel</label><input type="text" id="title" value="${esc(cur.title)}">
<label>URL-naam (slug)</label><input type="text" id="slug" value="${esc(cur.slug)}"><div class="hint">Wordt de link. Automatisch uit de titel; alleen aanpassen als je wilt.</div>
${isP?`<div class="grid2"><div><label>Categorie</label><select id="category">${CATS.map(([v,l])=>`<option value="${v}" ${cur.category===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div><label>Datum event</label><input type="date" id="event_date" value="${esc(cur.event_date||'')}"></div>
<div><label>Klant</label><input type="text" id="client" value="${esc(cur.client)}"></div><div><label>Plaats / locatie</label><input type="text" id="location" value="${esc(cur.location)}"></div></div>
<label>Naam event</label><input type="text" id="event_name" value="${esc(cur.event_name)}">
<label>Samenvatting</label><textarea id="summary">${esc(cur.summary)}</textarea><div class="hint">2–3 zinnen: wie, wat, waar en wat jij deed. Dit leest Google en AI.</div>`
:`<div class="grid2"><div><label>Soort</label><select id="type"><option value="guide" ${cur.type==='guide'?'selected':''}>Gids</option><option value="story" ${cur.type==='story'?'selected':''}>Verhaal</option></select></div>
<div><label>Publicatiedatum</label><input type="date" id="published_at" value="${esc(cur.published_at||'')}"></div></div>
<label>Korte samenvatting (1–2 zinnen, bovenaan)</label><textarea id="short_answer">${esc(cur.short_answer)}</textarea>
<label>Meta-omschrijving (Google, max ±155 tekens)</label><input type="text" id="description" value="${esc(cur.description)}">
<label>Tekst</label><textarea id="body" class="big">${esc(cur.body)}</textarea><div class="hint">Lege regel = nieuwe alinea. "## Kop" = tussenkop. "- item" = lijst.</div>`}
<label>Hoofdfoto</label><div class="thumbs" id="hero"></div><input type="file" id="heroF" accept="image/*" style="margin-top:10px">
${isP?`<label>Galerij (meerdere tegelijk)</label><div class="thumbs" id="gal"></div><input type="file" id="galF" accept="image/*" multiple style="margin-top:10px">`:''}
<label>Veelgestelde vragen (voor Google en AI)</label><div id="faq"></div><button class="btn o" id="addq" style="margin-top:8px">+ Vraag toevoegen</button>
<label class="chk"><input type="checkbox" id="published" ${cur.published?'checked':''}> Online zetten (zichtbaar na “Site publiceren”)</label></div>
<div class="bar"><button class="btn" id="save">Opslaan</button>${r.id?'<button class="btn d" id="del">Verwijderen</button>':''}</div>`;
const draw=()=>{$('#hero').innerHTML=cur.hero_url?`<div class="th"><img src="${esc(cur.hero_url)}"><button data-h>×</button></div>`:'';const hb=$('[data-h]');if(hb)hb.onclick=()=>{cur.hero_url='';draw()};
if(isP){$('#gal').innerHTML=cur.gallery.map((u,i)=>`<div class="th"><img src="${esc(u)}"><button data-g="${i}">×</button></div>`).join('');document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{cur.gallery.splice(+b.dataset.g,1);draw()})}
$('#faq').innerHTML=cur.faq.map((f,i)=>`<div class="faq"><input type="text" placeholder="Vraag" data-q="${i}" value="${esc(f.q)}"><textarea placeholder="Antwoord" data-a="${i}" style="min-height:70px">${esc(f.a)}</textarea><button class="btn o" data-x="${i}">Verwijder vraag</button></div>`).join('');
document.querySelectorAll('[data-q]').forEach(x=>x.oninput=()=>cur.faq[+x.dataset.q].q=x.value);document.querySelectorAll('[data-a]').forEach(x=>x.oninput=()=>cur.faq[+x.dataset.a].a=x.value);document.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{cur.faq.splice(+x.dataset.x,1);draw()})};draw();
const say=(t,e)=>{$('#m').innerHTML=t?`<div class="msg ${e?'err':''}">${esc(t)}</div>`:''};
let auto=!r.id;$('#title').oninput=e=>{if(auto)$('#slug').value=slugify(e.target.value)};$('#slug').oninput=()=>auto=false;
$('#back').onclick=list;$('#addq').onclick=()=>{cur.faq.push({q:'',a:''});draw()};
const slug=()=>$('#slug').value||slugify($('#title').value);
$('#heroF').onchange=async e=>{try{say('Foto uploaden…');cur.hero_url=await upload(e.target.files[0],slug());say('');draw()}catch(x){say('Upload mislukt: '+x.message,1)}};
if(isP)$('#galF').onchange=async e=>{try{for(const [i,f] of [...e.target.files].entries()){say(`Foto ${i+1} van ${e.target.files.length} uploaden…`);cur.gallery.push(await upload(f,slug()))}say('');draw()}catch(x){say('Upload mislukt: '+x.message,1)}};
$('#save').onclick=async()=>{const g=id=>$('#'+id)?.value||null;
const row=isP?{title:g('title'),slug:slug(),category:g('category'),event_date:g('event_date'),client:g('client'),location:g('location'),event_name:g('event_name'),summary:g('summary'),gallery:cur.gallery}
:{title:g('title'),slug:slug(),type:g('type'),published_at:g('published_at'),short_answer:g('short_answer'),description:g('description'),body:g('body')};
row.hero_url=cur.hero_url||null;row.faq=cur.faq.filter(f=>f.q&&f.a);row.published=$('#published').checked;
if(!row.title)return say('Vul een titel in.',1);if(row.published&&!row.hero_url)return say('Voeg eerst een hoofdfoto toe om online te zetten.',1);
$('#save').disabled=true;const q=r.id?sb.from(tab).update(row).eq('id',r.id):sb.from(tab).insert(row);const{error}=await q;
if(error){$('#save').disabled=false;return say('Opslaan mislukt: '+error.message,1)}msg='Opgeslagen. Klik op “Site publiceren” om het live te zetten.';list()};
if(r.id)$('#del').onclick=async()=>{if(!confirm('Echt verwijderen?'))return;const{error}=await sb.from(tab).delete().eq('id',r.id);if(error)return say(error.message,1);msg='Verwijderd.';list()}}
init();
</script>
</body>
</html>
