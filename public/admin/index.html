const progress=(pct,t)=>{S.msg=t;const x=$('#msg');if(!x)return;x.className='msg';x.style.display='block';x.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:8px"><span>${esc(t)}</span><b>${Math.round(pct)}%</b></div><div class="bar" style="background:#ffffff26;height:8px"><i style="width:${pct}%;transition:width .25s"></i></div>`};
const metaKey=n=>String(n||'').toLowerCase().replace(/\.[^.]+$/,'');
const getMeta=()=>{try{return JSON.parse(localStorage.getItem('photoMeta')||'{}')}catch(e){return{}}};
function dHash(im){const st=(i,w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(i,0,0,w,h);return c};const p=st(st(im,340,320),17,16).getContext('2d').getImageData(0,0,17,16).data;let b='';for(let y=0;y<16;y++)for(let x=0;x<16;x++){const l=i=>.299*p[i]+.587*p[i+1]+.114*p[i+2];b+=l((y*17+x)*4)>l((y*17+x+1)*4)?'1':'0'}return BigInt('0b'+b).toString(16).padStart(64,'0')}
const hamm=(a,c)=>{let v=BigInt('0x'+a)^BigInt('0x'+c),n=0;while(v){n+=Number(v&1n);v>>=1n}return n};
function findMeta(f,im){const m=getMeta(),k=metaKey(f.name);if(m[k])return m[k];let h;try{h=dHash(im)}catch(e){return null}let best=null,bd=65;Object.keys(m).forEach(q=>{if(q[0]!=='#')return;const d=hamm(h,q.slice(1));if(d<bd){bd=d;best=m[q]}});return best}
function importMeta(txt){const a=JSON.parse(txt);if(!Array.isArray(a))throw new Error('Expected a list');const m=getMeta();a.forEach(x=>{if(x.hash)m['#'+x.hash]=x;if(x.original)m[metaKey(x.original)]=x});try{localStorage.setItem('photoMeta',JSON.stringify(m))}catch(e){}return a.length}
const autoName=n=>{let t=cleanN(n).replace(/_/g,' '),y=(t.match(/(?:^|[^0-9])(20[12]\d)(?=[^0-9]|$)/)||t.match(/(?:TML|ML|DQ)(2[0-9])(?=[^0-9]|\s)/i)||[])[1];if(y&&y.length===2)y='20'+y;t=t.replace(/\b\d?TML\d*/gi,' tomorrowland ').replace(/\b(CR3|HQ|byMartinHols|MartinHols\d*|Martin[- ]?Hols\d*|TheArrows|The[- ]Arrows|Festivalphotographer|Photography|Photographer|Fotografie|6I4A\d+|MHR?\d*|\d{1,}|Festival|Photo|Portfolio)\b/gi,' ');let r=slug(t);if(y&&r&&!r.includes(y))r+='-'+y;return r||'photo'};
async function uploadFiles(files,toProject){
 files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
 if(toProject){if(!S.proj?.id){const ok=await saveProject(true);if(!ok)return}if(S.photos.length+files.length>24)return say('Up to 24 photos per project.',1)}
 const N=files.length,fails=[];let n=0;
 for(const f of files){n++;const at=(k,t)=>progress(((n-1)+k)/N*100,`Photo ${n} of ${N} · ${t}`);
  try{at(0,'reading '+f.name);const im=await loadImg(f);at(.1,'making the large version');const {b,w,h}=await enc(im,2400);
   const MT=toProject?null:findMeta(f,im);const base=(MT&&MT.file&&slug(cleanN(MT.file)))||slug([toProject?S.proj.slug:'',autoName(f.name)].filter(Boolean).join('-'))||'photo';const file=base+'.jpg';
   const path=`${toProject?S.proj.slug:'single'}/${Date.now()}-${file}`;
   const put=async(p,blob,type)=>{const r=await sb.storage.from('photos').upload(p,blob,{contentType:type});if(r.error)throw r.error};
   at(.25,'making smaller versions');
   const jobs=[[path,b,'image/jpeg'],[path.replace(/\.jpg$/,'-s.jpg'),(await enc(im,800)).b,'image/jpeg']];
   for(const wd of [640,1280,2400]){if(wd>Math.max(im.width,im.height)&&wd!==640)continue;const v=await enc(im,wd,'image/webp',.72);if(v.b.type!=='image/webp')break;jobs.push([path.replace(/\.jpg$/,'-'+wd+'.webp'),v.b,'image/webp'])}
   let done=0;at(.5,'uploading');await Promise.all(jobs.map(([p,bl,t])=>put(p,bl,t).then(()=>{done++;at(.5+.45*done/jobs.length,`uploading (${done}/${jobs.length} files)`)})));
   at(.95,'saving');const url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl,P=S.proj;
   const row={file,url,width:w,height:h,bytes:b.size,marked:false,portfolio:false,top:false};
   if(toProject){row.project_id=P.id;row.event=P.event_name||null;row.year=P.event_date?+P.event_date.slice(0,4):null;row.city=P.location||null;row.categories=P.categories||[];row.taken_on=P.event_date||null}
   if(MT){['alt','caption','event','year','city','taken_on'].forEach(k=>{if(MT[k]!=null&&MT[k]!=='')row[k]=MT[k]});if(Array.isArray(MT.categories))row.categories=MT.categories.filter(k=>CN[k]);if(Array.isArray(MT.subjects))row.subjects=MT.subjects;}
   const{data,error}=await sb.from('photos').insert(row).select().single();if(error)throw error;S.all.push(data);URL.revokeObjectURL(im.src)
  }catch(e){fails.push(`${f.name}: ${e.message||e}`)}}
 S.photos=S.proj?S.all.filter(x=>x.project_id===S.proj.id):[];S.singles=S.all.filter(x=>!x.project_id);
 if(!S.sel&&S.photos[0])S.sel=S.photos[0].id;show();
 fails.length?say(`${N-fails.length} of ${N} uploaded. Failed: ${fails.join(' · ')}`,1):say(`${N} photo${N>1?'s':''} uploaded.`)}

<div class="limit"><div class="big"><span>${on.length} of ${MAXP}</span><small>on in the portfolio</small></div><div class="bar" style="margin-top:8px"><i style="width:${on.length}%"></i></div><p class="hint" style="margin-top:8px">${Math.max(0,MAXP-on.length)} spots left. ${off.length} marked photos are off. Top: ${cntT()} of ${MAXT}.</p></div></div>
<div class="row" style="margin-top:28px;flex-wrap:wrap"><div class="chips">${fb('all','All marked',A.length)}${fb('on','On',on.length)}${fb('off','Off',off.length)}${fb('top','Top',cntT())}${fb('inc','To finish',A.filter(x=>!isDone(x)).length)}${fb('hid','Hidden',arch.length)}</div><div class="chips">${CATS.map(([k,l])=>`<button class="chip ${F.c===k?'on':''}" data-pfc="${k}">${l} · ${cc(k)}</button>`).join('')}</div></div>
<div class="pgrid">${shown.map(p=>`<div class="pt ${p.portfolio?'':'off'}"><div class="im" data-pe="${p.id}" style="cursor:pointer"><img class="imgc" src="${esc(p.url)}" alt="" loading="lazy"><button class="star ${p.top?'on':''}" data-top="${p.id}" title="${p.top?'Top photo · click to remove':'Add to Top '+MAXT}">${I.star}</button><span class="cat">${(p.categories||[]).map(k=>CN[k]).join(' · ')}</span></div>
<div class="row2"><div><div class="nm" data-pe="${p.id}" style="cursor:pointer">${esc(p.event||p.file)}</div><div class="ev">${p.year||''} · <span class="st ${isDone(p)?'ok':'no'}"></span>${isDone(p)?'complete':'to finish'} · <a href="#" data-pe="${p.id}" style="color:inherit;text-decoration:underline">Edit</a></div></div>${p.archived?`<button class="chip" data-arch="${p.id}|0">Show again</button>`:`<button class="sw ${p.portfolio?'on':''}" data-pf="${p.id}"><i></i>${p.portfolio?'On':'Off'}</button>`}</div>${p.archived?'':`<a href="#" data-arch="${p.id}|1" class="hint" style="text-decoration:underline">Hide from overview</a>`}</div>`).join('')||'<p class="hint">Nothing here yet. Star photos in a project or as single photos.</p>'}</div>
<div class="row" style="margin-top:28px;padding-top:20px;border-top:1px solid var(--line)"><span class="hint">Showing ${shown.length} of ${L.length} · On first, then latest uploads</span>${L.length>shown.length?'<button class="chip" data-more>Show more</button>':''}</div></section>
${(()=>{const e=S.pe&&S.all.find(x=>x.id===S.pe);return e?`<div class="drawer-bg" data-pclose></div><aside class="drawer"><div class="row" style="margin-bottom:16px"><p class="eyebrow">Edit photo</p><button class="btn dk" data-pclose>Close</button></div>${editor(e,esc(e.file),true)}</aside>`:''})()}
<div class="foot2"><div><p class="eyebrow">How the limit works</p><p>The portfolio holds up to 100 photos. At 100, the next photo can only go on when you switch another one off. Up to 20 photos can be Top; they show first on the site. Switching a photo off also removes its Top.</p></div><div><p class="eyebrow">Photos without alt text</p><p>A photo without alt text can go on. The site makes a simple description from event, city and year until you write one. Search engines like your own better, so add it later.</p></div></div>`}

/* ---------- events ---------- */
async function setPf(id,on){const p=S.all.find(x=>x.id===id);if(on&&cntP()>=MAXP)return say('The portfolio is full (100). Switch another photo off first.',1);
 await dbPhoto(id,on?{portfolio:true,marked:true}:{portfolio:false,top:false});say('')}
async function setTop(id,on){const p=S.all.find(x=>x.id===id);if(on&&!p.portfolio)return say('Put the photo in the portfolio first.',1);if(on&&cntT()>=MAXT)return say('Top is full (20). Remove another Top first.',1);await dbPhoto(id,{top:on});say('')}
function readSingle(){const p=cur();if(!p)return null;const o={};document.querySelectorAll('[data-s]').forEach(x=>o[x.dataset.s]=x.value);o.year=o.year?+o.year||null:null;o.file=slug(cleanN(o.file||p.file))+'.jpg';return o}
function bind(){
 document.querySelectorAll('.im[data-focus]').forEach(b=>{const i=b.querySelector('img');(i.complete?placeDot(b):i.addEventListener('load',()=>placeDot(b)));b.onclick=async e=>{if(e.target.closest('.fclr'))return;try{const x=S.all.find(p=>p.id===b.dataset.focus),f=fpos(x,b),r=b.getBoundingClientRect(),fx=Math.round(Math.min(100,Math.max(0,(e.clientX-r.left+f.ox)/f.dw*100))),fy=Math.round(Math.min(100,Math.max(0,(e.clientY-r.top+f.oy)/f.dh*100)));await dbPhoto(x.id,{focus_x:fx,focus_y:fy});document.querySelectorAll('.im[data-focus="'+x.id+'"]').forEach(placeDot);say('')}catch(x){say(x.message,1)}}});
 document.querySelectorAll('[data-fclr]').forEach(c=>c.onclick=async e=>{e.stopPropagation();try{await dbPhoto(c.dataset.fclr,{focus_x:null,focus_y:null});document.querySelectorAll('.im[data-focus="'+c.dataset.fclr+'"]').forEach(placeDot);say('')}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{if(S.tab==='project')readForm();S.tab=b.dataset.tab;S.pe=null;S.msg='';await loadAll();show()});
 document.querySelectorAll('[data-drop]').forEach(d=>{const t=d.dataset.drop;d.onclick=()=>{$('#fileIn').dataset.t=t;$('#fileIn').click()};d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');uploadFiles(e.dataTransfer.files,t==='project')}});
 const sum=$('#f-sum');if(sum)sum.oninput=()=>$('#f-cnt').textContent=sum.value.length+' / 200';
 const op=$('#f-open');if(op)op.onchange=async()=>{S.proj=S.projects.find(x=>x.id===op.value)||null;S.photos=S.proj?S.all.filter(x=>x.project_id===S.proj.id):[];S.sel=S.photos[0]?.id;show()};
 document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=async()=>{try{readForm();const P=S.proj||(S.proj={categories:[]}),on=!P.pinned;if(on&&S.projects.filter(p=>p.pinned&&p.id!==P.id).length>=4)return say('You can pin 4 projects. Unpin one first.',1);P.pinned=on;if(P.id){const{error}=await sb.from('projects').update({pinned:on}).eq('id',P.id);if(error){P.pinned=!on;return say(error.message,1)}const q=S.projects.find(p=>p.id===P.id);if(q)q.pinned=on}show();say('')}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-pcat]').forEach(b=>b.onclick=()=>{readForm();const P=S.proj,k=b.dataset.pcat;P.categories=(P.categories||[]).includes(k)?P.categories.filter(x=>x!==k):[...(P.categories||[]),k];show()});
 document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-star]'))return;readForm();S.sel=b.dataset.sel;show()});
 document.querySelectorAll('[data-star]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const p=S.all.find(x=>x.id===b.dataset.star);try{p.marked?await dbPhoto(p.id,{marked:false,portfolio:false,top:false}):await dbPhoto(p.id,{marked:true,...((p.alt||'').trim()&&cntP()<MAXP?{portfolio:true}:{})});show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=async()=>{try{const k=b.dataset.slot,cur=S.photos.find(x=>x.id===S.sel),old=S.photos.find(x=>x.slot===k&&x.id!==S.sel);if(old)await dbPhoto(old.id,{slot:null});await dbPhoto(S.sel,{slot:cur.slot===k?null:k});show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-delsel]').forEach(b=>b.onclick=async()=>{try{const p=S.all.find(x=>x.id===b.dataset.delsel);if(!p||!confirm('Delete this photo from the project? This cannot be undone.'))return;readForm();const{error}=await sb.from('photos').delete().eq('id',p.id);if(error)return say(error.message,1);S.sel=null;await loadAll();if(S.proj&&S.proj.id)await saveProject(true);show();say('Photo deleted.')}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=async()=>{try{const p=S.all.find(x=>x.id===b.dataset.pf);await setPf(p.id,!p.portfolio);show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-top]').forEach(b=>b.onclick=async(e)=>{e.stopPropagation();try{const p=S.all.find(x=>x.id===b.dataset.top);await setTop(p.id,!p.top);show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-alt]').forEach(t=>{t.onchange=async()=>{try{await dbPhoto(t.dataset.alt,{alt:t.value.trim()||null});show()}catch(x){say(x.message,1)}}});
 document.querySelectorAll('[data-sug]').forEach(b=>b.onclick=async()=>{try{const p=S.all.find(x=>x.id===b.dataset.sug),t=$('[data-s="alt"]');if(t){t.value=suggest(p);t.focus()}else{await dbPhoto(p.id,{alt:suggest(p)});show()}}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>{S.ss=+b.dataset.ss;show()});
 document.querySelectorAll('[data-scat]').forEach(b=>b.onclick=async()=>{try{const p=cur(),k=b.dataset.scat,c=(p.categories||[]).includes(k)?p.categories.filter(x=>x!==k):[...(p.categories||[]),k];await dbPhoto(p.id,{...readSingle(),categories:c});show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-rmsub]').forEach(b=>b.onclick=async()=>{try{const p=cur();await dbPhoto(p.id,{subjects:p.subjects.filter((_,i)=>i!==+b.dataset.rmsub)});show()}catch(x){say(x.message,1)}});
 const as=$('[data-addsub]');if(as)as.onclick=async()=>{const t=prompt('Subject (e.g. pyro, crowd)');if(!t)return;try{const p=cur();await dbPhoto(p.id,{subjects:[...(p.subjects||[]),t.trim()]});show()}catch(x){say(x.message,1)}};
 document.querySelectorAll('[data-cpc]').forEach(b=>b.onclick=()=>{S.cp.c=b.dataset.cpc;S.cp.n=24;show()});
 document.querySelectorAll('[data-cpf]').forEach(b=>b.onclick=()=>{S.cp.f=b.dataset.cpf;S.cp.n=24;show()});
 {const c=$('[data-cpclear]');if(c)c.onclick=async()=>{const k=S.cp.c,L=S.all.filter(x=>!x.archived&&x.portfolio&&(x.categories||[]).includes(k));if(!L.length)return;if(!confirm('Take all '+L.length+' chosen photos of '+CN[k]+' off the portfolio? Photos that also belong to another category go off there too.'))return;try{for(const x of L)await dbPhoto(x.id,{portfolio:false,top:false});say(L.length+' photos taken off. Live after Publish site.');show()}catch(e){say(e.message,1)}}}
 {const m=$('[data-cpmore]');if(m)m.onclick=()=>{S.cp.n+=24;show()}}
 document.querySelectorAll('[data-pff]').forEach(b=>b.onclick=()=>{S.pf.f=b.dataset.pff;S.pf.n=20;show()});
 document.querySelectorAll('[data-pfc]').forEach(b=>b.onclick=()=>{S.pf.c=S.pf.c===b.dataset.pfc?null:b.dataset.pfc;S.pf.n=20;show()});
 document.querySelectorAll('[data-hname]').forEach(i=>{i.onclick=e=>e.stopPropagation();i.onchange=async()=>{try{await dbPhoto(i.dataset.hname,{event:i.value.trim()||null});say('Name saved. Visible after Publish site.')}catch(x){say(x.message,1)}}});
 document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=async()=>{try{const p=S.all.find(x=>x.id===b.dataset.hero);await setHero(p.id,!p.home_hero);show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=async()=>{try{const [id,k]=b.dataset.ch.split('|'),p=S.all.find(x=>x.id===id);await setCatHeader(id,k,p.cat_header!==k);show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-shmore]').forEach(b=>b.onclick=()=>{const k=b.dataset.shmore;if(k==='h')S.sh.n+=24;else S.sh.c[k]=(S.sh.c[k]||12)+12;show()});
 document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=e=>{e.preventDefault();S.pe=b.dataset.pe;show()});document.querySelectorAll('[data-pclose]').forEach(b=>b.onclick=()=>{S.pe=null;show()});
 document.querySelectorAll('[data-arch]').forEach(b=>b.onclick=async e=>{e.preventDefault();try{const[i,v]=b.dataset.arch.split('|');await dbPhoto(i,v==='1'?{archived:true,portfolio:false,top:false}:{archived:false});show()}catch(x){say(/archived/.test(x.message)?'Run schema-6.sql in Supabase first (adds the Hide option).':x.message,1)}});
 const mo=$('[data-more]');if(mo)mo.onclick=()=>{S.pf.n+=20;show()};
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const a=b.dataset.act;try{
  if(a==='draft'){if(S.tab==='project'){await saveProject();show()}else say('Saved.')}
  else if(a==='pub'){await publishProject();show()}
  else if(a==='site')await publishSite();
  else if(a==='sugall'){for(const p of S.photos.filter(x=>(x.slot||x.portfolio)&&!(x.alt||'').trim()))await dbPhoto(p.id,{alt:suggest(p)});show()}
  else if(a==='savephoto'||a==='savenext'){const p=cur(),o=readSingle();await dbPhoto(p.id,o);say('Photo saved.');if(S.tab!=='portfolio'){const L=S.singles,n=L.length;let nx=-1;if(a==='savenext')for(let k=1;k<=n;k++){const j=(S.ss+k)%n;if(!isDone(L[j])){nx=j;break}}S.keep=nx<0;if(nx>=0)S.ss=nx}show()}
  else if(a==='impmeta'){$('#metaIn').click()}
  else if(a==='tidy'){const n=await tidyNames();say(n+' file names tidied. Publish the site to use them.');show()}
  else if(a==='delphoto'){const p=cur();if(!confirm('Delete this photo?'))return;await sb.from('photos').delete().eq('id',p.id);await loadAll();S.ss=0;S.pe=null;show()}
 }catch(x){say(x.message||String(x),1)}});
}
document.addEventListener('change',async e=>{if(e.target.id!=='metaIn')return;try{let n=0;for(const f of e.target.files)n+=importMeta(await f.text());e.target.value='';if(!n)return;say(n+' descriptions loaded. Now drop the matching photos.');show()}catch(x){say('Import failed: '+x.message,1)}});
$('#fileIn').onchange=e=>{uploadFiles(e.target.files,e.target.dataset.t==='project');e.target.value=''};
init();
</script>
</body>
</html>
