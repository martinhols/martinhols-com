function importMeta(txt){const a=JSON.parse(txt);if(!Array.isArray(a))throw new Error('Expected a list');const m=getMeta();a.forEach(x=>{if(x.hash)m['#'+x.hash]=x;if(x.original)m[metaKey(x.original)]=x});try{localStorage.setItem('photoMeta',JSON.stringify(m))}catch(e){}return a.length}
async function uploadFiles(files,toProject){
 files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
 if(toProject){if(!S.proj?.id){const ok=await saveProject(true);if(!ok)return}if(S.photos.length+files.length>24)return say('Up to 24 photos per project.',1)}
 const N=files.length,fails=[];let n=0;
 for(const f of files){n++;const at=(k,t)=>progress(((n-1)+k)/N*100,`Photo ${n} of ${N} · ${t}`);
  try{at(0,'reading '+f.name);const im=await loadImg(f);at(.1,'making the large version');const {b,w,h}=await enc(im,2400);
   const MT=toProject?null:findMeta(f,im);const base=(MT&&MT.file&&slug(cleanN(MT.file)))||slug([toProject?S.proj.slug:'',cleanN(f.name)].filter(Boolean).join('-'))||'photo';const file=base+'.jpg';
   const path=`${toProject?S.proj.slug:'single'}/${Date.now()}-${file}`;
   const put=async(p,blob,type)=>{const r=await sb.storage.from('photos').upload(p,blob,{contentType:type});if(r.error)throw r.error};
   at(.25,'making smaller versions');
   const jobs=[[path,b,'image/jpeg'],[path.replace(/\.jpg$/,'-s.jpg'),(await enc(im,800)).b,'image/jpeg']];
   for(const wd of [640,1280,2400]){if(wd>Math.max(im.width,im.height)&&wd!==640)continue;const v=await enc(im,wd,'image/webp',.8);if(v.b.type!=='image/webp')break;jobs.push([path.replace(/\.jpg$/,'-'+wd+'.webp'),v.b,'image/webp'])}
   let done=0;at(.5,'uploading');await Promise.all(jobs.map(([p,bl,t])=>put(p,bl,t).then(()=>{done++;at(.5+.45*done/jobs.length,`uploading (${done}/${jobs.length} files)`)})));
   at(.95,'saving');const url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl,P=S.proj;
   const row={file,url,width:w,height:h,bytes:b.size};
   if(toProject){row.project_id=P.id;row.event=P.event_name||null;row.year=P.event_date?+P.event_date.slice(0,4):null;row.city=P.location||null;row.categories=P.categories||[];row.taken_on=P.event_date||null}
   if(MT){['alt','caption','event','year','city','taken_on'].forEach(k=>{if(MT[k]!=null&&MT[k]!=='')row[k]=MT[k]});if(Array.isArray(MT.categories))row.categories=MT.categories.filter(k=>CN[k]);if(Array.isArray(MT.subjects))row.subjects=MT.subjects;if(MT.portfolio)row.portfolio=true;if(MT.top){row.top=true;row.portfolio=true}}
   const{data,error}=await sb.from('photos').insert(row).select().single();if(error)throw error;S.all.push(data);URL.revokeObjectURL(im.src)
  }catch(e){fails.push(`${f.name}: ${e.message||e}`)}}
 S.photos=S.proj?S.all.filter(x=>x.project_id===S.proj.id):[];S.singles=S.all.filter(x=>!x.project_id);
 if(!S.sel&&S.photos[0])S.sel=S.photos[0].id;show();
 fails.length?say(`${N-fails.length} of ${N} uploaded. Failed: ${fails.join(' · ')}`,1):say(`${N} photo${N>1?'s':''} uploaded.`)}

<div class="row" style="margin-top:28px;flex-wrap:wrap"><div class="chips">${fb('all','All marked',A.length)}${fb('on','On',on.length)}${fb('off','Off',off.length)}${fb('top','Top',cntT())}${fb('alt','Alt text missing',A.filter(x=>!(x.alt||'').trim()).length)}</div><div class="chips">${CATS.map(([k,l])=>`<button class="chip ${F.c===k?'on':''}" data-pfc="${k}">${l} · ${cc(k)}</button>`).join('')}</div></div>
<div class="pgrid">${shown.map(p=>`<div class="pt ${p.portfolio?'':'off'}"><div class="im"><img class="imgc" src="${esc(p.url)}" alt="" loading="lazy">${p.top?`<span class="tp">${I.star}Top</span>`:''}<span class="cat">${(p.categories||[]).map(k=>CN[k]).join(' · ')}</span></div>
<div class="row2"><div><div class="nm">${esc(p.event||p.file)}</div><div class="ev">${p.year||''} · <span class="st ${(p.alt||'').trim()?'ok':'no'}"></span>${(p.alt||'').trim()?'alt ok':'alt missing'}</div></div><button class="sw ${p.portfolio?'on':''}" data-pf="${p.id}"><i></i>${p.portfolio?'On':'Off'}</button></div></div>`).join('')||'<p class="hint">Nothing here yet. Star photos in a project or as single photos.</p>'}</div>
<div class="row" style="margin-top:28px;padding-top:20px;border-top:1px solid var(--line)"><span class="hint">Showing ${shown.length} of ${L.length} · Top first, then newest</span>${L.length>shown.length?'<button class="chip" data-more>Show more</button>':''}</div></section>
<div class="foot2"><div><p class="eyebrow">How the limit works</p><p>The portfolio holds up to 100 photos. At 100, the next photo can only go on when you switch another one off. Up to 20 photos can be Top; they show first on the site. Switching a photo off also removes its Top.</p></div><div><p class="eyebrow">Photos without alt text</p><p>A photo without alt text can’t go on. It shows a small orange dot until it has one.</p></div></div>`}

/* ---------- events ---------- */
async function setPf(id,on){const p=S.all.find(x=>x.id===id);if(on&&!(p.alt||'').trim())return say('Add alt text first: a photo without alt text can’t go in the portfolio.',1);if(on&&cntP()>=MAXP)return say('The portfolio is full (100). Switch another photo off first.',1);
 await dbPhoto(id,on?{portfolio:true,marked:true}:{portfolio:false,top:false});say('')}
async function setTop(id,on){const p=S.all.find(x=>x.id===id);if(on&&!p.portfolio)return say('Put the photo in the portfolio first.',1);if(on&&cntT()>=MAXT)return say('Top is full (20). Remove another Top first.',1);await dbPhoto(id,{top:on});say('')}
function readSingle(){const p=S.singles[S.ss];if(!p)return null;const o={};document.querySelectorAll('[data-s]').forEach(x=>o[x.dataset.s]=x.value);o.year=o.year?+o.year||null:null;o.file=slug(cleanN(o.file||p.file))+'.jpg';return o}
function bind(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{if(S.tab==='project')readForm();S.tab=b.dataset.tab;S.msg='';await loadAll();show()});
 document.querySelectorAll('[data-drop]').forEach(d=>{const t=d.dataset.drop;d.onclick=()=>{$('#fileIn').dataset.t=t;$('#fileIn').click()};d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');uploadFiles(e.dataTransfer.files,t==='project')}});
 const sum=$('#f-sum');if(sum)sum.oninput=()=>$('#f-cnt').textContent=sum.value.length+' / 200';
 const op=$('#f-open');if(op)op.onchange=async()=>{S.proj=S.projects.find(x=>x.id===op.value)||null;S.photos=S.proj?S.all.filter(x=>x.project_id===S.proj.id):[];S.sel=S.photos[0]?.id;show()};
 document.querySelectorAll('[data-pcat]').forEach(b=>b.onclick=()=>{readForm();const P=S.proj,k=b.dataset.pcat;P.categories=(P.categories||[]).includes(k)?P.categories.filter(x=>x!==k):[...(P.categories||[]),k];show()});
 document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-star]'))return;readForm();S.sel=b.dataset.sel;show()});
 document.querySelectorAll('[data-star]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const p=S.all.find(x=>x.id===b.dataset.star);try{p.marked?await dbPhoto(p.id,{marked:false,portfolio:false,top:false}):await dbPhoto(p.id,{marked:true,...((p.alt||'').trim()&&cntP()<MAXP?{portfolio:true}:{})});show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=async()=>{try{const k=b.dataset.slot,cur=S.photos.find(x=>x.id===S.sel),old=S.photos.find(x=>x.slot===k&&x.id!==S.sel);if(old)await dbPhoto(old.id,{slot:null});await dbPhoto(S.sel,{slot:cur.slot===k?null:k});show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=async()=>{try{const p=S.all.find(x=>x.id===b.dataset.pf);await setPf(p.id,!p.portfolio);show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-top]').forEach(b=>b.onclick=async()=>{try{const p=S.all.find(x=>x.id===b.dataset.top);await setTop(p.id,!p.top);show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-alt]').forEach(t=>{t.onchange=async()=>{try{await dbPhoto(t.dataset.alt,{alt:t.value.trim()||null});show()}catch(x){say(x.message,1)}}});
 document.querySelectorAll('[data-sug]').forEach(b=>b.onclick=async()=>{try{const p=S.all.find(x=>x.id===b.dataset.sug),t=$('[data-s="alt"]');if(t){t.value=suggest(p);t.focus()}else{await dbPhoto(p.id,{alt:suggest(p)});show()}}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>{S.ss=+b.dataset.ss;show()});
 document.querySelectorAll('[data-scat]').forEach(b=>b.onclick=async()=>{try{const p=S.singles[S.ss],k=b.dataset.scat,c=(p.categories||[]).includes(k)?p.categories.filter(x=>x!==k):[...(p.categories||[]),k];await dbPhoto(p.id,{...readSingle(),categories:c});show()}catch(x){say(x.message,1)}});
 document.querySelectorAll('[data-rmsub]').forEach(b=>b.onclick=async()=>{try{const p=S.singles[S.ss];await dbPhoto(p.id,{subjects:p.subjects.filter((_,i)=>i!==+b.dataset.rmsub)});show()}catch(x){say(x.message,1)}});
 const as=$('[data-addsub]');if(as)as.onclick=async()=>{const t=prompt('Subject (e.g. pyro, crowd)');if(!t)return;try{const p=S.singles[S.ss];await dbPhoto(p.id,{subjects:[...(p.subjects||[]),t.trim()]});show()}catch(x){say(x.message,1)}};
 document.querySelectorAll('[data-pff]').forEach(b=>b.onclick=()=>{S.pf.f=b.dataset.pff;S.pf.n=20;show()});
 document.querySelectorAll('[data-pfc]').forEach(b=>b.onclick=()=>{S.pf.c=S.pf.c===b.dataset.pfc?null:b.dataset.pfc;S.pf.n=20;show()});
 const mo=$('[data-more]');if(mo)mo.onclick=()=>{S.pf.n+=20;show()};
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const a=b.dataset.act;try{
  if(a==='draft'){if(S.tab==='project'){await saveProject();show()}else say('Saved.')}
  else if(a==='pub'){await publishProject();show()}
  else if(a==='site')await publishSite();
  else if(a==='sugall'){for(const p of S.photos.filter(x=>(x.slot||x.portfolio)&&!(x.alt||'').trim()))await dbPhoto(p.id,{alt:suggest(p)});show()}
  else if(a==='savephoto'||a==='savenext'){const p=S.singles[S.ss],o=readSingle();await dbPhoto(p.id,o);say('Photo saved.');if(a==='savenext')S.ss=Math.min(S.ss+1,S.singles.length-1);show()}
  else if(a==='impmeta'){$('#metaIn').click()}
  else if(a==='delphoto'){const p=S.singles[S.ss];if(!confirm('Delete this photo?'))return;await sb.from('photos').delete().eq('id',p.id);await loadAll();S.ss=0;show()}
 }catch(x){say(x.message||String(x),1)}});
}
document.addEventListener('change',async e=>{if(e.target.id!=='metaIn')return;try{let n=0;for(const f of e.target.files)n+=importMeta(await f.text());e.target.value='';if(!n)return;say(n+' descriptions loaded. Now drop the matching photos.');show()}catch(x){say('Import failed: '+x.message,1)}});
$('#fileIn').onchange=e=>{uploadFiles(e.target.files,e.target.dataset.t==='project');e.target.value=''};
init();
</script>
</body>
</html>
